<mat-card class="card users-card">
  <mat-card-header class="card__header">
    <mat-card-title>
      <span>Users</span>
    </mat-card-title>
    @if (authFacade.isAdminRole()) {
    <span class="flex-spacer"></span>
    <button mat-icon-button aria-label="Open New User form" (click)="goToNew()">
      <mat-icon>add</mat-icon>
    </button>
    }
  </mat-card-header>
  <mat-card-content>
    @if (!userFacade.loading()) { @if (userFacade.error()) {
    <p class="error-message">{{ userFacade.error() }}</p>
    } @else {
    <app-users-list [users]="userFacade.users()" (edit)="goToEdit($event)" />
    } } @else {
    <div class="spinner-container">
      <mat-spinner></mat-spinner>
    </div>
    }
  </mat-card-content>
</mat-card>
